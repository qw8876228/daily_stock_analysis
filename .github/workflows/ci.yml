# CI 流程 - Pull Request 自动检测
# 当有 PR 提交或推送到 main 分支时自动运行

name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - '.github/workflows/**'
      - 'Dockerfile'
      - 'docker-compose.yml'

jobs:
  # ==================== 核心检查（必须通过）====================
  check:
    name: ✅ 代码检查
    runs-on: [self-hosted, Linux, X64, daily-stock-ci]
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      
      - name: 🐍 语法检查
        run: |
          python -m py_compile main.py config.py analyzer.py notification.py
          python -m py_compile storage.py scheduler.py search_service.py
          python -m py_compile market_analyzer.py stock_analyzer.py
          python -m py_compile data_provider/*.py
          echo "✅ Python 语法检查通过"
      
      - name: 🔎 静态分析 (严重错误)
        run: |
          # 只检查严重错误：语法错误、未定义变量等
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: ✅ 模块导入测试
        run: |
          python -c "from config import get_config; print('✅ config')"
          python -c "from storage import DatabaseManager; print('✅ storage')"
          python -c "from notification import NotificationService; print('✅ notification')"
          python -c "from data_provider import DataFetcherManager; print('✅ data_provider')"
          python -c "from analyzer import GeminiAnalyzer; print('✅ analyzer')"
          echo "✅ 所有模块导入成功"

  # ==================== Docker 构建测试 ====================
  docker:
    name: 🐳 Docker 构建
    runs-on: [self-hosted, Linux, X64, daily-stock-ci]
    needs: [check]
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: Verify Docker daemon data root is on /vol2
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_ROOT="$(docker info --format '{{.DockerRootDir}}')"
          REAL_DOCKER_ROOT="$(realpath -e -- "$DOCKER_ROOT")"
          VOL2_DEVICE="$(stat -c '%d' /vol2)"
          DOCKER_DEVICE="$(stat -c '%d' "$REAL_DOCKER_ROOT")"
          [[ "$REAL_DOCKER_ROOT" == /vol2 || "$REAL_DOCKER_ROOT" == /vol2/* ]] || { echo "::error::Docker data root is outside /vol2: $REAL_DOCKER_ROOT"; exit 1; }
          [[ "$DOCKER_DEVICE" == "$VOL2_DEVICE" ]] || { echo "::error::Docker data root is not on the verified /vol2 device."; exit 1; }
          printf 'DOCKER_DATA_ROOT_VERIFIED=%s device=%s\n' "$REAL_DOCKER_ROOT" "$DOCKER_DEVICE"
      - name: 🐳 构建镜像
        run: |
          docker build -t stock-analysis:test .
          docker run --rm stock-analysis:test python -c "print('✅ Docker OK')"
